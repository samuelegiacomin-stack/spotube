name: iOS cloud verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to verify
        required: true
        default: codex/ios-artwork-downloads
      runner:
        description: macOS runner (Intel avoids ARM capacity shortages)
        required: true
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-latest

jobs:
  build-ios:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    steps:
      - name: Checkout Spotube
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout ComposeNativeWebview
        uses: actions/checkout@v4
        with:
          repository: KRTirtho/ComposeNativeWebview
          ref: cbd36f88927298a28a2d64c6acf7ec3b2def6f9d
          path: compose-webview

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache native toolchains and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.cargo/registry
            ~/.cargo/git
          key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', '**/Cargo.lock') }}
          restore-keys: ios-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish ComposeNativeWebview
        working-directory: compose-webview
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Compile Kotlin/Native iOS
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      - name: Install CocoaPods dependencies
        run: |
          cd iosApp
          pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          app=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry Spotube-ios-unsigned.ipa Payload
          git rev-parse HEAD > BUILD-INFO.txt
          shasum -a 256 Spotube-ios-unsigned.ipa >> BUILD-INFO.txt
          printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> BUILD-INFO.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spotube-ios-unsigned
          path: |
            Spotube-ios-unsigned.ipa
            BUILD-INFO.txt
